# App per Mac di Gioco Folle! (Tauri 2): una finestra che mostra il gioco web costruito in dist-desktop/.
[package]
name = "gioco-folle"
version = "0.2.0"
description = "Gioco Folle! per Mac"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
# app più piccola
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
