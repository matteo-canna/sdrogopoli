# Esegue i test e pubblica il gioco su GitHub Pages a ogni push su main.
name: Test e pubblicazione

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un gruppo per ramo: le prove di una PR non fermano più la pubblicazione di main
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # server TURN di riserva per il gioco online (facoltativo): variabili del repository
        # TURN_URLS, TURN_USER, TURN_PASS in Settings > Secrets and variables > Actions > Variables
        env:
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USER: ${{ vars.TURN_USER }}
          VITE_TURN_PASS: ${{ vars.TURN_PASS }}
      # prove nel browser: partita completa, accessibilità (axe), telefono, memoria del 3D, offline
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
